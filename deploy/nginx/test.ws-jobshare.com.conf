# --- HTTP -> HTTPS ---
server {
    listen 80;
    server_name test.ws-jobshare.com;

    return 301 https://$host$request_uri;
}

# --- HTTPS ---
server {
    listen 443 ssl;
    server_name test.ws-jobshare.com;

    client_max_body_size 60m;

    ssl_certificate /etc/letsencrypt/live/test.ws-jobshare.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test.ws-jobshare.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # =========================
    # SSE
    # =========================

    location = /api_jobshare/api/admin/public-ctv-chat/inbox-stream {
        proxy_pass http://127.0.0.1:3001/api/admin/public-ctv-chat/inbox-stream;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding off;
    }

    location = /api_jobshare/api/admin/public-candidate-chat/inbox-stream {
        proxy_pass http://127.0.0.1:3001/api/admin/public-candidate-chat/inbox-stream;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding off;
    }

    location = /api_jobshare/api/public/ctv-chat/stream {
        proxy_pass http://127.0.0.1:3001/api/public/ctv-chat/stream;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding off;
    }

    location = /api_jobshare/api/public/candidate-chat/stream {
        proxy_pass http://127.0.0.1:3001/api/public/candidate-chat/stream;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding off;
    }

    location = /api_jobshare/api/ctv/notifications/stream {
        proxy_pass http://127.0.0.1:3001/api/ctv/notifications/stream;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding off;
    }

    location = /api_jobshare/api/admin/notifications/stream {
        proxy_pass http://127.0.0.1:3001/api/admin/notifications/stream;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding off;
    }

    # =========================
    # Socket.IO
    # =========================

    location /socket.io/ {
        proxy_pass http://127.0.0.1:3001/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # =========================
    # API
    # =========================

    location /api_jobshare/ {
        client_max_body_size 60m;

        proxy_pass http://127.0.0.1:3001/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /api_ai/ {
        client_max_body_size 60m;

        proxy_pass http://127.0.0.1:3002;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # =========================
    # Codexa (static SPA) — files in /home/ubuntu/codexa
    # URL: https://test.ws-jobshare.com/codexa/
    # =========================

    location = /codexa {
        return 301 /codexa/;
    }

    location /codexa/ {
        root /home/ubuntu;
        index index.html;
        try_files $uri $uri/ /codexa/index.html;
    }

    # =========================
    # Jobshare frontend
    # =========================

    root /home/ubuntu/staging/Web/frontend;
    index index.html;

    location ~ ^/(vi|en|ja)(/candidate)?/blog/([^/]+)/?$ {
        error_page 418 = @blog_og_proxy;

        if ($is_social_bot) {
            return 418;
        }

        try_files $uri $uri/ /index.html;
    }

    location @blog_og_proxy {
        proxy_pass http://127.0.0.1:3001/public/og$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
